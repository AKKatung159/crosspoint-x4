name: X4 Thai (build, test, release)

# This fork's CI. Upstream's workflows only run in crosspoint-reader/crosspoint-reader.
#  - every push to main and every PR: host tests + the x4_th firmware build
#  - a tag like 1.6.5-th.5: the same, then a GitHub release with the firmware and
#    the notes in docs/personal/releases/<tag>.md (Thai first, English below)
#  - server/ (x4-hub, the homelab side): tests on every push/PR, and on main the
#    image ghcr.io/akkatung159/x4-hub (:latest and :sha-<short>)

on:
  push:
    branches: [main]
    tags: ['*-th.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libexpat1-dev

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Build and run
        run: |
          cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure -j

  firmware:
    name: Build x4_th
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-x4th-v3-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio.personal.ini') }}
          restore-keys: pio-x4th-v3-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO (pioarduino 6.1.19)
        # Same as upstream's CI (.github/workflows/ci.yml).
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        # The platform's own penv otherwise resolves "pioarduino>=6.1.19" to 6.2.0, whose
        # tool-scons fights the platform's pinned one ("No module named
        # 'SCons.Tool.FortranCommon'"); see pioarduino/platform-espressif32#529.
        run: |
          set -euo pipefail
          pio pkg install -e x4_th
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Read the version
        id: version
        run: |
          v=$(sed -n 's/^version = //p' platformio.personal.ini | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "$v" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match version $v in platformio.personal.ini"
            exit 1
          fi

      - name: Build
        run: pio run -e x4_th

      - name: Size
        run: |
          size=$(stat -c %s .pio/build/x4_th/firmware.bin)
          echo "firmware.bin: $size bytes ($((size * 100 / 6710886))% of the 6.4 MiB app partition)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: crosspoint-${{ steps.version.outputs.version }}-x3-x4
          path: .pio/build/x4_th/firmware.bin
          if-no-files-found: error

  server:
    name: x4-hub (homelab service)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test (with libraqm for Thai shaping)
        working-directory: server
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libraqm0
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium
          python -c "from PIL import features; assert features.check('raqm'), 'no raqm'"
          pytest -q tests

      - uses: actions/upload-artifact@v4
        with:
          name: x4-hub-dashboard-samples
          path: server/tests/_out/*.png

      - uses: docker/setup-buildx-action@v3

      - name: Build the image and check it (size, rendering inside it)
        # The homelab VM has little disk: refuse anything over 900 MB.
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: x4-hub:ci
          cache-from: type=gha,scope=x4-hub
          cache-to: type=gha,mode=max,scope=x4-hub
      - run: |
          size=$(docker image inspect x4-hub:ci --format '{{.Size}}')
          echo "x4-hub image: $((size / 1048576)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$size" -le 943718400 ] || { echo "::error::image over 900 MB"; exit 1; }
          docker run --rm x4-hub:ci python -c "
          from x4hub import context, layouts, render
          im = render.screenshot(layouts.render_html(layouts.read('default'), context.sample()))
          assert im.size == (480, 800), im.size
          print('render inside the image: ok')"

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/akkatung159/x4-hub
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=x4-hub
          cache-to: type=gha,mode=max,scope=x4-hub

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: crosspoint-${{ needs.firmware.outputs.version }}-x3-x4

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/personal/releases/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing $notes (write the Thai + English notes before tagging)"
            exit 1
          fi
          bin="crosspoint-$TAG-x3-x4.bin"
          mv firmware.bin "$bin"
          sha=$(sha256sum "$bin" | cut -d' ' -f1)
          { cat "$notes"; printf '\n\nSHA-256 (`%s`): `%s`\n' "$bin" "$sha"; } > notes.md
          gh release create "$TAG" "$bin" --title "$TAG" --notes-file notes.md --verify-tag
