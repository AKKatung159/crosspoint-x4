; Personal fork build environments (AKKatung159/crosspoint-x4).
; Kept out of platformio.ini so upstream merges only ever touch one line there.
;
;   pio run -e x4_th            -> .pio/build/x4_th/firmware.bin
;
; Same profile as upstream's [env:gh_release] (the official X3/X4 image), plus
; this fork's version string and OTA source.

[personal]
version = 2.0.0-th.1

; Everything but the log level, which each env sets once: build_unflags does
; not reach the ESP-IDF components, so a second -DLOG_LEVEL there is a
; "redefined" error under -Werror.
[personal_flags]
build_flags =
  -DCROSSPOINT_VERSION=\"${personal.version}\"
  -DCROSSPOINT_RELEASES_API=\"https://api.github.com/repos/AKKatung159/crosspoint-x4/releases/latest\"
  -DPERSONAL_SOFT_CLOCK=1
  -DENABLE_SERIAL_LOG

[x4_th_flags]
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  ${personal_flags.build_flags}

[env:x4_th]
extends = base, firmware_tuned_c3
; PERSONAL: only English and Thai UI strings, to save flash (other languages fall back to English).
custom_i18n_builtin_langs = en,th
build_flags =
  ${x4_th_flags.build_flags}
  -DLOG_LEVEL=1

; Test build for end-to-end runs on a real X4 over USB: adds serial commands
; "CMD:PRESS <button> [ms]" and "CMD:MEM" (scripts/device/x4test.py). Same
; firmware otherwise; do not publish it as a release.
[env:x4_th_test]
extends = env:x4_th
build_flags =
  ${x4_th_flags.build_flags}
  -DPERSONAL_SERIAL_INPUT=1
  -DLOG_LEVEL=2

; Xteink X4 Pro (ESP32-S3, PSRAM, touch, SDMMC): upstream's [env:x4pro-gh_release]
; plus the same personal flags. On an RTC-equipped board PERSONAL_SOFT_CLOCK is
; inert (it only applies when no RTC is detected).
;
;   pio run -e x4pro_th         -> .pio/build/x4pro_th/firmware.bin
[env:x4pro_th]
extends = env:x4pro-gh_release
; PERSONAL: only English and Thai UI strings, to save flash (other languages fall back to English).
custom_i18n_builtin_langs = en,th
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ${personal_flags.build_flags}
  -DLOG_LEVEL=1

; Xteink X4 Classic (ESP32-S3, PSRAM, SDMMC, buttons only: no touch, no frontlight):
; upstream's [env:x4c-gh_release] plus the same personal flags.
;
;   pio run -e x4c_th           -> .pio/build/x4c_th/firmware.bin
[env:x4c_th]
extends = env:x4c-gh_release
; PERSONAL: only English and Thai UI strings, to save flash (other languages fall back to English).
custom_i18n_builtin_langs = en,th
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4CLASSIC=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Classic\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ${personal_flags.build_flags}
  -DLOG_LEVEL=1
